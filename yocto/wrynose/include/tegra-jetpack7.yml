repos:
  meta-tegra:
    # refers to the wrynose branch
    commit: 6a0294838e8e0180a40cd3d48d7d0fce1deb3ef2
  meta-tegra-community:
    # refers to the wrynose branch
    commit: 3cdf23379dfc7082e2d4957f5f1d90eda02170e7
  meta-tegrademo:
    # refers to the wrynose branch
    commit: 37e974f3479de348b0ef87a0363beeed9db46f91

  meta-mender-community:
    # url and revision are named by the update-scheme include, tegra-classic.yml
