header:
  version: 14

distro: poky

repos:
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core.git
    # refers to the wrynose branch
    commit: 5d1aa5c806c061a2994f4decb59016610f093213
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake.git
    # refers to the 2.18 branch
    commit: acfe02fa38b5da9e6a36c6cedcf91d4fcbefbfbd
    layers:
      bitbake: disabled

  meta-yocto:
    url: https://git.yoctoproject.org/git/meta-yocto.git
    # refers to the wrynose branch
    commit: 824795b885b25e074a2880fbcd54e1a6c875d47d
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    # refers to the wrynose branch
    commit: 100027977216601000cbefc42c2ff6cf667e7b5e
    layers:
      meta-oe:

  meta-mender:
    url: https://github.com/mendersoftware/meta-mender.git
    # refers to the wrynose branch
    commit: acc45e431e1aa6360a78c182a8c2578bd43af990

    layers:
      meta-mender-core:

local_conf_header:
  base: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    INIT_MANAGER = "systemd"

  mender-artifact: |
    MENDER_ARTIFACT_NAME = "gha_autobuild"

target:
  - core-image-minimal
