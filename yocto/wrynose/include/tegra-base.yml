# Common Tegra bits for the wrynose Jetpack configurations: the OE4T layer set,
# the tegrademo distro, and the Mender integration switches that apply to every
# Jetson. Jetpack-specific pinning lives in tegra-jetpack<N>.yml.
header:
  version: 14

repos:
  meta-mender:
    # refers to the wrynose branch
    commit: acc45e431e1aa6360a78c182a8c2578bd43af990

  meta-tegra:
    url: https://github.com/OE4T/meta-tegra.git
  meta-tegra-community:
    url: https://github.com/OE4T/meta-tegra-community.git
  meta-tegrademo:
    url: https://github.com/OE4T/tegra-demo-distro.git
    layers:
      layers/meta-tegra-support:
      layers/meta-demo-ci:
      layers/meta-tegrademo:

  meta-openembedded:
    layers:
      meta-filesystems:
      meta-networking:
      meta-python:

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization.git
    # refers to the wrynose branch
    commit: 781735b97ae5013cacabbecd38e6da6b510cf3fb

  meta-mender-community:
    url: https://github.com/mendersoftware/meta-mender-community.git
    # refers to the wrynose branch
    commit: 78b2895adcf2053595e1508bc5846aa1c3d033ba
    layers:
      meta-mender-tegra/meta-mender-tegra-common:

distro: tegrademo

local_conf_header:
  tegra: |
    # these two classes only work as intended when being inherited in the
    # OE4t setup-env.sh style environment, as they modify bblayers.conf
    # and expect additional information on the host.
    INHERIT:remove = "tegra-support-sanity distro_layer_buildinfo"
    INHERIT += "tegra-mender-setup"
    MENDER_FEATURES_ENABLE:append = " mender-growfs-data"
    MENDER_FEATURES_DISABLE:append = " mender-uboot"
    # meta-tegra renamed the flashable image type tegraflash -> tegraflash-tar
    # in the Jetpack 7 / wrynose era.
    IMAGE_FSTYPES:tegra = "tegraflash-tar mender dataimg"
    IMAGE_FSTYPES:pn-tegra-minimal-initramfs:tegra = "${INITRAMFS_FSTYPES}"
    IMAGE_FSTYPES:pn-tegra-initrd-flash-initramfs:tegra = "${TEGRA_INITRD_FLASH_INITRAMFS_FSTYPES}"
