# NVIDIA Jetson Orin Nano 8GB Developer Kit booting from an M.2 NVMe SSD (T234,
# machine jetson-orin-nano-devkit-nvme), Jetpack 7 / L4T r39.2.0 — Mender OTA
# build with the Tegra-native update scheme. Wrynose (Yocto 6.0) variant, pinned.
#
# The same board and medium as ../classic/jetson-orin-nano-devkit-nvme.yml,
# differing only in which update scheme it selects. Everything about the module,
# the stock external layout with UDA=p15 ahead of the rootfs slots, and the two
# 14 GiB A/B slots is described there and applies unchanged: the scheme does not
# touch the data partition, and the module resolves the rootfs slots by the APP
# and APP_b partlabels.
#
# What changes is inside the artifact. This scheme emits the tegra-rootfs-image
# payload type, carrying the rootfs and the UEFI capsule, and the device installs
# it with an update module that calls nvbootctrl and the capsule directly rather
# than through fw_printenv shims and Mender state scripts. The file keeps the
# canonical .mender name, so nothing about uploading or deploying changes.
#
# The two schemes are mutually exclusive on the device as well as in the build: an
# artifact from one cannot be installed by the other, in either direction, so a
# board cannot be moved between them by an update. Choose per board, at flash time.
#
# Note that writing this drive goes through initrd-flash with the board in
# recovery mode over USB, which also writes QSPI. There is no SD-Mux equivalent
# for the M.2 slot.
header:
  version: 14
  includes:
  - yocto/wrynose/include/mender-full.yml
  - yocto/wrynose/include/tegra-jetpack7.yml
  - yocto/wrynose/include/tegra-native.yml

machine: jetson-orin-nano-devkit-nvme

# core-image-base rather than core-image-minimal: the Realtek NIC on the p3768
# carrier arrives through MACHINE_EXTRA_RRECOMMENDS, which only packagegroup-base
# consumes, so core-image-minimal boots with no network interface and a Mender
# client that can never reach the server.
target:
  - core-image-base
