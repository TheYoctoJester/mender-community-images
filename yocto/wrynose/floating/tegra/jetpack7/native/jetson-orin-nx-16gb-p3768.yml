# NVIDIA Jetson Orin NX 16GB on the p3768 carrier (T234, machine
# p3768-0000-p3767-0000), Jetpack 7 / L4T r39.2.0 — Mender OTA build with the
# Tegra-native update scheme. Wrynose (Yocto 6.0) variant, floating.
#
# The same board as ../../classic/jetson-orin-nx-16gb-p3768.yml, differing only in
# which update scheme it selects. Everything about the hardware, the custom
# external layout and the growable permanet_user_storage data partition is
# described there and applies unchanged: the update scheme does not touch the data
# partition, and the module resolves the rootfs slots by the APP and APP_b
# partlabels, which are the same on either layout.
#
# What changes is inside the artifact. This scheme emits the tegra-rootfs-image
# payload type, carrying the rootfs and the UEFI capsule, and the device installs
# it with an update module that calls nvbootctrl and the capsule directly rather
# than through fw_printenv shims and Mender state scripts. The file keeps the
# canonical .mender name, so nothing about uploading or deploying changes.
#
# The two schemes are mutually exclusive on the device as well as in the build: an
# artifact from one cannot be installed by the other, in either direction, so a
# board cannot be moved between them by an update. Choose per board, at flash time.
#
# NOT VERIFIED ON HARDWARE. There is no 16GB module on the bench this work was
# developed against, so nothing here has been flashed, deployed to or booted. What
# is checked is the build, and the generated flash layout, on this machine.
#
# The one place the two modules genuinely differ for this scheme is that layout.
# Because it comes from the layer rather than from NVIDIA, it reaches the filename
# rewrite only through TEGRA_MENDER_LAYOUT_FILENAMES_EXTRA and the second pass in
# the tegra-storage-layout bbappend. Without those the recovery partition would be
# created and left empty, with a green build and the boot image sitting unused in
# the flash package. If you enable TEGRA_MENDER_RECOVERY here, check the generated
# external-flash.xml.in names tegra-mender-recovery.img in the recovery partition
# before trusting it.
header:
  version: 14
  includes:
  - yocto/wrynose/floating/include/mender-full.yml
  - yocto/wrynose/floating/include/tegra-jetpack7.yml
  - yocto/wrynose/floating/include/tegra-native.yml

machine: p3768-0000-p3767-0000

# core-image-base rather than core-image-minimal: the Realtek RTL8111/8168 NIC
# on the p3768 carrier is pulled in through MACHINE_EXTRA_RRECOMMENDS, which
# only packagegroup-base consumes. core-image-minimal does not include it, so
# the board boots with no network interface at all and a Mender client that can
# never reach the server.
target:
  - core-image-base
