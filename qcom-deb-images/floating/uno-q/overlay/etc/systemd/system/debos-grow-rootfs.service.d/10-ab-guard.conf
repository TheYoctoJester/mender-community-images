# The upstream image recipe generates debos-grow-rootfs.service to grow
# "partition 2" of the boot disk to 100% on first boot — correct for the stock
# single-rootfs layout, wrong on the A/B eMMC GPT (system_a/system_b are
# fixed-size; userdata is the partition that grows, via the ptool patch XML at
# flash time + x-systemd.growfs at runtime). This drop-in disables the unit on
# the A/B layout without patching the upstream recipe.
[Unit]
ConditionPathExists=!/dev/disk/by-partlabel/system_a
