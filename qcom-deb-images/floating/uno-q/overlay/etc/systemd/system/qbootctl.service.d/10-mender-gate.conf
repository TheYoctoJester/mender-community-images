# Suppress the qbootctl package's automatic slot "bless" (qbootctl -m at
# boot-complete.target) while a Mender A/B update is in flight, so Mender owns
# commit/rollback. The qbootctl-rootfs update module creates this flag on
# ArtifactInstall and removes it on ArtifactCommit/ArtifactRollback. On normal
# (non-update) boots the flag is absent, so the bless service runs as usual and
# keeps the running slot marked good.
[Unit]
ConditionPathExists=!/data/mender-ab-updating
