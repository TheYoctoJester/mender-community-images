# A/B system partition block for the Arduino Uno Q (appended to the stock
# qcom-ptool qrb2210-unoq/emmc-16GB partitions.conf after dropping its single
# "rootfs" partition). Mirrors the layout proven by the Yocto uno-q integration
# (meta-mender-qcom qcom-partition-conf bbappend):
#  - dtbo_a/dtbo_b: empty, but REQUIRED — qbootctl's set-active path refuses to
#    run without a dtbo_a partition present.
#  - system_a/system_b: both provisioned from the same built root filesystem at
#    flash time, so a fresh flash always has two bootable slots.
#  - userdata: persistent /data (Mender state), grown to the end of the eMMC by
#    the ptool patch XML (--grow-last-partition) + x-systemd.growfs at runtime.
#    Programmed with a fresh empty filesystem at flash time so a reflash never
#    inherits a previous OS's Mender identity.
--partition --name=dtbo_a --size=8192KB --type-guid=24D0D418-D31D-4D8D-AC2C-4D4305188450
--partition --name=dtbo_b --size=8192KB --type-guid=24D0D418-D31D-4D8D-AC2C-4D4305188450
--partition --name=system_a --size=5242880KB --type-guid=B921B045-1DF0-41C3-AF44-4C6F280D3FAE --filename=../disk-sdcard.img2
--partition --name=system_b --size=5242880KB --type-guid=B921B045-1DF0-41C3-AF44-4C6F280D3FAE --filename=../disk-sdcard.img2
--partition --name=userdata --size=2145728KB --type-guid=0FC63DAF-8483-4772-8E79-3D69D8477DE4 --filename=userdata.img
